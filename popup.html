<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Filter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 520px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(to right, #00f5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .lock-icon {
      width: 12px;
      height: 12px;
      fill: #888;
    }

    /* AD CONTAINER */
    .ad-container {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.06) 0%, rgba(168, 85, 247, 0.06) 100%);
      border: 1px solid rgba(0, 245, 255, 0.25);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .ad-container:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 245, 255, 0.12);
      border-color: rgba(0, 245, 255, 0.4);
    }

    .ad-label {
      font-size: 9px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ad-label svg {
      width: 10px;
      height: 10px;
      fill: #888;
    }

    .ad-content {
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .ad-content:hover {
      opacity: 0.85;
    }

    .ad-content img {
      width: 100%;
      height: auto;
      max-height: 70px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .ad-text {
      font-size: 13px;
      font-weight: 600;
      color: #00f5ff;
      line-height: 1.4;
      margin-bottom: 3px;
    }

    .ad-subtitle {
      font-size: 10px;
      color: #aaa;
      line-height: 1.3;
    }

    .ad-loading {
      text-align: center;
      padding: 6px;
      color: #666;
      font-size: 10px;
      font-style: italic;
    }

    /* IMAGE AD WITH TEXT OVERLAY */
    .ad-image-overlay {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      min-height: 80px;
    }

    .ad-bg-image {
      width: 100%;
      height: auto;
      min-height: 80px;
      max-height: 100px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .ad-overlay-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.7) 50%, transparent 100%);
      pointer-events: none;
    }

    .ad-overlay-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px;
      z-index: 2;
    }

    .ad-image-overlay .ad-text {
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      margin-bottom: 2px;
    }

    .ad-image-overlay .ad-subtitle {
      color: #00f5ff;
      font-size: 9px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.1);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #00f5ff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title svg {
      width: 14px;
      height: 14px;
      fill: #00f5ff;
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: #ccc;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: 0.3s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #22c55e;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .status-text {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: 500;
    }

    .status-active {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-paused {
      background: rgba(251, 146, 60, 0.2);
      color: #fb923c;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .stat-item {
      text-align: center;
      padding: 8px;
      background: rgba(0, 245, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 245, 255, 0.15);
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #00f5ff;
    }

    .stat-value-purple {
      color: #a855f7;
    }

    .platform-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .platform-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid;
    }

    .badge-instagram {
      background: rgba(225, 48, 108, 0.2);
      color: #E1306C;
      border-color: rgba(225, 48, 108, 0.4);
    }

    .badge-tiktok {
      background: rgba(0, 242, 234, 0.2);
      color: #00F2EA;
      border-color: rgba(0, 242, 234, 0.4);
    }

    .badge-snapchat {
      background: rgba(255, 252, 0, 0.2);
      color: #FFFC00;
      border-color: rgba(255, 252, 0, 0.4);
    }

    .badge-facebook {
      background: rgba(24, 119, 242, 0.2);
      color: #1877F2;
      border-color: rgba(24, 119, 242, 0.4);
    }

    .badge-twitter {
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .badge-youtube {
      background: rgba(255, 0, 0, 0.2);
      color: #FF0000;
      border-color: rgba(255, 0, 0, 0.4);
    }

    .badge-reddit {
      background: rgba(255, 69, 0, 0.2);
      color: #FF4500;
      border-color: rgba(255, 69, 0, 0.4);
    }

    .badge-linkedin {
      background: rgba(10, 102, 194, 0.2);
      color: #0A66C2;
      border-color: rgba(10, 102, 194, 0.4);
    }

    .recent-list {
      max-height: 140px;
      overflow-y: auto;
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      margin-bottom: 6px;
      background: rgba(0, 245, 255, 0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(0, 245, 255, 0.15);
    }

    .recent-item:hover {
      background: rgba(0, 245, 255, 0.1);
      border-color: rgba(0, 245, 255, 0.3);
      transform: translateX(2px);
    }

    .recent-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recent-username {
      font-size: 11px;
      font-weight: 500;
      color: #e0e0e0;
    }

    .recent-time {
      font-size: 10px;
      color: #888;
    }

    .no-data {
      text-align: center;
      color: #666;
      font-size: 11px;
      padding: 12px;
      font-style: italic;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f5ff 0%, #a855f7 100%);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 245, 255, 0.3);
    }

    .btn-secondary {
      background: rgba(0, 245, 255, 0.1);
      color: #00f5ff;
      border: 1px solid rgba(0, 245, 255, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(0, 245, 255, 0.15);
      border-color: rgba(0, 245, 255, 0.5);
    }

    .btn-privacy {
      background: rgba(168, 85, 247, 0.1);
      color: #a855f7;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .btn-privacy:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.5);
    }

    .copyright {
      text-align: center;
      font-size: 9px;
      color: #555;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 6px;
    }

    .copyright strong {
      color: #00f5ff;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #777;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">SOCIAL FILTER</h1>
    <p class="subtitle">
      <svg class="lock-icon" viewBox="0 0 24 24">
        <path d="M12 1C8.676 1 6 3.676 6 7v2H5c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h14c1.103 0 2-.897 2-2V11c0-1.103-.897-2-2-2h-1V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4z"/>
      </svg>
      100% Privacy Protected OSINT Tracker
    </p>
  </div>

  <!-- DYNAMIC AD CONTAINER -->
  <div id="adContainer" class="ad-container">
    <div class="ad-loading">Loading...</div>
  </div>

  <div class="card">
    <div class="toggle-container">
      <span class="toggle-label">Tracking Status</span>
      <label class="toggle">
        <input type="checkbox" id="trackingToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <p id="statusText" class="status-text">Loading...</p>
  </div>

  <div class="card">
    <h2 class="card-title">
      <svg viewBox="0 0 24 24">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
      </svg>
      Quick Stats
    </h2>
    <div class="stats-grid">
      <div class="stat-item">
        <p class="stat-label">Total Profiles</p>
        <p id="totalCount" class="stat-value">0</p>
      </div>
      <div class="stat-item">
        <p class="stat-label">Platforms</p>
        <p id="platformCount" class="stat-value stat-value-purple">0</p>
      </div>
    </div>
    <div id="platformBreakdown" class="platform-badges"></div>
  </div>

  <div class="card">
    <h2 class="card-title">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/>
      </svg>
      Recent Visits
    </h2>
    <div id="recentList" class="recent-list">
      <p class="no-data">No visits yet</p>
    </div>
  </div>

  <button id="openDashboard" class="btn btn-primary">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
    </svg>
    Open Full Dashboard
  </button>
  
  <button id="openSettings" class="btn btn-secondary">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    Settings
  </button>
  
  <button id="viewPrivacy" class="btn btn-privacy">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
    Privacy Policy
  </button>

  <div class="copyright">
    Created by <strong>Muhammad Ilyas</strong> | All Rights Reserved
  </div>

  <script src="popup.js"></script>
</body>
</html>
